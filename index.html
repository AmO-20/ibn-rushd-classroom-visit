<style>
:root{--green:#176b45;--gold:#c69b38;--light:#f3f7f4}*{box-sizing:border-box}
body{margin:0;background:var(--light);font-family:Tahoma,Arial,sans-serif;color:#24352c}
header{background:linear-gradient(120deg,#105638,#218357);color:white;text-align:center;padding:22px 14px}
header img{width:105px;height:105px;object-fit:contain;background:white;border-radius:15px;padding:6px}
header h1{font-size:23px;margin:12px 0 5px}header p{margin:4px}
.school{display:block;width:min(94%,760px);max-height:260px;object-fit:cover;margin:18px auto;border-radius:14px}
main{max-width:900px;margin:18px auto;padding:0 12px}.card{background:white;border-radius:15px;padding:20px;margin:14px 0;box-shadow:0 3px 14px #173c2812}
h2{color:var(--green);font-size:20px;margin-top:0}label{display:block;font-weight:bold;margin:14px 0 7px}
input,select,textarea{width:100%;padding:12px;border:1px solid #cbd8cf;border-radius:9px;font:inherit;background:white}
textarea{min-height:100px;resize:vertical}button,.btn{border:0;border-radius:9px;padding:12px 19px;font:inherit;font-weight:bold;cursor:pointer;background:var(--green);color:white}
.gold{background:var(--gold);color:#18251d}.topbar{max-width:900px;margin:14px auto 0;padding:0 12px;display:flex;justify-content:flex-start}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.hidden{display:none!important}
.notice{padding:12px;border-radius:9px;margin:12px 0;background:#edf7ef}.error{background:#fff0ef;color:#a22}
.rating{border:1px solid #e0e9e2;border-radius:10px;padding:14px;margin:12px 0;background:#fff}
.rating h3{font-size:16px;line-height:1.8;margin:0 0 10px;color:#263c30}
.indicator{padding:12px 10px;border-top:1px solid #e7eee8}.indicator p{margin:0 0 8px;line-height:1.7}
.levels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.levels label{display:flex;align-items:center;justify-content:center;gap:5px;border:1px solid #dbe6dd;border-radius:8px;padding:9px 4px;margin:0;font-size:13px;font-weight:normal}
.levels input{width:auto;margin:0;accent-color:var(--green)}
footer{text-align:center;padding:20px;color:#68786e;font-size:13px}small{color:#69766e}
@media(max-width:520px){.levels{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:15px}}
</style></head><body>

<section class="card" id="gate"><h2>الدخول إلى نموذج الزيارة الصفية</h2>

<form id="reportForm" class="hidden">
<section class="card"><h2>بيانات الزيارة الصفية</h2>
<label for="visitDate">التاريخ</label><input id="visitDate" type="date" required>
<label for="employee">اسم الموظف</label><select id="employee" required><option value="">اختر اسم الموظف</option></select>
<label for="specialty">التخصص</label><select id="specialty" required><option value="">اختر التخصص</option></select>
</section>

<label for="trainingNeeds">الاحتياجات التدريبية</label><textarea id="trainingNeeds" placeholder="اكتب الاحتياجات التدريبية المقترحة..."></textarea>
<label for="evidence">إرفاق صور أو ملفات داعمة</label><input id="evidence" type="file" multiple accept="image/*,.pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx">
<small>الحد الأقصى 12MB لكل ملف.</small><div id="fileMessage"></div>
<div class="actions"><button id="submitButton" type="submit">إرسال التقرير وحفظه</button><button type="button" class="gold" onclick="location.reload()">إلغاء والعودة</button></div><p id="status"></p>
</section></form></main>
<footer>مدارس ابن رشد — نظام الزيارة الصفية</footer>
